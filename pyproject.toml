[project]
name = "CogFormer"
version = "0.1.0"
description = "Learn All Your Models Once"
authors = [
    { name = "Jerry M. Huang", email = "aca.jerryh@gmail.com" },
    { name = "Lukas Schumacher", email = "lu.schumacher@unibas.ch" },
    { name = "Niek Stevenson", email = "niek.stevenson@gmail.com" },
    { name = "Stefan T. Radev", email = "stefanradev93@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bayesflow",
    "jupyter>=1.1.1",
    "keras>=3.14.0",
    "matplotlib>=3.10.9",
    "notebook>=7.4.1",
    "numba>=0.64.0",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
]

# BayesFlow is taken from the best-defaults branch, not PyPI: the encoder-rep
# aDDM arms are run at that branch's retuned network defaults. Pinned to a
# commit rather than the branch name so `uv sync` cannot silently move it.
[tool.uv.sources]
bayesflow = { git = "https://github.com/bayesflow-org/bayesflow.git", rev = "6842dcee3c0afaa319a0b578617bf5740061bc35" }

